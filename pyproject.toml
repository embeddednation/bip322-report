[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bip322-report"
version = "0.9.1"
description = "The statement of a period in which every coin is backed by a verified BIP-322 proof of control: holdings, movements, reconciliation, HTML/CSV/PDF, on top of bip322-audit"
requires-python = ">=3.11"
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "bip322report/fonts/LICENSE.md"]
readme = "README.md"
authors = [{ name = "Embedded Nation AB" }]
keywords = ["bitcoin", "bip322", "proof of control", "audit", "multisig", "psbt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Security :: Cryptography",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "bip322-audit>=0.12.1,<0.13",
    "bip322-core>=0.11.1,<0.12",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/embeddednation/bip322-report"
Changelog = "https://github.com/embeddednation/bip322-report/blob/main/CHANGELOG.md"

[project.optional-dependencies]
kernel = ["bip322-audit[kernel]>=0.12.1,<0.13"]
pdf = ["weasyprint>=60"]
dev = ["pytest>=8"]

[project.scripts]
bip322-report = "bip322report.cli:main"

[tool.setuptools.packages.find]
include = ["bip322report*"]

[tool.setuptools.package-data]
bip322report = ["templates/*.html", "fonts/*.woff2", "fonts/LICENSE.md", "handbook.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501"]
